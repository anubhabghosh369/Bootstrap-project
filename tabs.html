<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Tabs</title>
  <link href="css/main.css" rel="stylesheet">
</head>
<body>
  <main class="container my-5">
    <h1 class="mb-4">Bootstrap Tabs</h1>

    <ul class="nav nav-tabs" id="tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                data-bs-target="#home" type="button" role="tab"
                aria-controls="home" aria-selected="true">Home</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="profile-tab" data-bs-toggle="tab"
                data-bs-target="#profile" type="button" role="tab"
                aria-controls="profile" aria-selected="false">Profile</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="contact-tab" data-bs-toggle="tab"
                data-bs-target="#contact" type="button" role="tab"
                aria-controls="contact" aria-selected="false">Contact</button>
      </li>
    </ul>

    <div class="tab-content border border-top-0 rounded-bottom p-3" id="tabs-content">
      <section class="tab-pane fade show active" id="home" role="tabpanel"
               aria-labelledby="home-tab" tabindex="0">
        <h2>Home</h2>
        <p>Welcome to the Home tab. Select another tab to view its content.</p>
      </section>
      <section class="tab-pane fade" id="profile" role="tabpanel"
               aria-labelledby="profile-tab" tabindex="0">
        <h2>Profile</h2>
        <p>This is the Profile tab. Add profile details or other content here.</p>
      </section>
      <section class="tab-pane fade" id="contact" role="tabpanel"
               aria-labelledby="contact-tab" tabindex="0">
        <h2>Contact</h2>
        <p>This is the Contact tab. Add contact information or a form here.</p>
      </section>
    </div>
  </main>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
